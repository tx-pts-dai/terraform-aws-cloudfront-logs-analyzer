name: summarizer-layer

on:
  pull_request:
    paths:
      - summarizer/**
      - .github/workflows/summarizer-layer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build layer
        run: |
          pip install -r summarizer/requirements.txt \
            --platform manylinux2014_x86_64 --python-version 3.12 --only-binary=:all: \
            -t build/python --no-compile
          find build/python -exec touch -h -t 202001010000 {} +
          find build -name __pycache__ -type d -prune -exec rm -r {} +
          (cd build && find python -print | LC_ALL=C sort | zip -qX -@ layer.zip)
          mv -f build/layer.zip summarizer/layer.zip

      - name: Test
        run: |
          pip install -r summarizer/requirements.txt
          cd summarizer && AWS_DEFAULT_REGION=eu-central-1 python test_handler.py

      - name: Commit layer
        run: |
          if [ -n "$(git status --porcelain summarizer/layer.zip)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add summarizer/layer.zip
            git commit -m "Rebuild summarizer layer"
            git push
          fi
