name: summarizer-layer

on:
  pull_request:
    paths:
      - summarizer/**
      - .github/workflows/summarizer-layer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build layer
        run: |
          pip install --require-hashes -r summarizer/requirements.txt \
            --platform manylinux2014_x86_64 --python-version 3.12 --only-binary=:all: \
            -t build/python --no-compile
          find build/python -exec touch -h -t 202001010000 {} +
          find build -name __pycache__ -type d -prune -exec rm -r {} +
          (cd build && find python -print | LC_ALL=C sort | zip -qX -@ layer.zip)
          mv -f build/layer.zip summarizer/layer.zip

      - name: Test
        run: |
          pip install --require-hashes -r summarizer/requirements.txt
          cd summarizer && AWS_DEFAULT_REGION=eu-central-1 python test_handler.py

      - name: Check layer is reproducible
        if: github.event_name == 'workflow_dispatch'
        run: git diff --exit-code summarizer/layer.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: layer
          path: summarizer/layer.zip
          if-no-files-found: error

  commit:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layer
          path: summarizer

      - name: Commit layer
        run: |
          if [ -n "$(git status --porcelain summarizer/layer.zip)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add summarizer/layer.zip
            git commit -m "Rebuild summarizer layer"
            git push
          fi
